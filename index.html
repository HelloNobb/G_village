<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2b2540" />
    <title>G village</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <h1>G village</h1>
        <div id="clockbar">
          <span id="day-label">Day 0</span>
          <span id="time-label">--:--</span>
        </div>
        <div id="speed" role="group" aria-label="배속">
          <button data-speed="0" title="일시정지">⏸</button>
          <button data-speed="1">1×</button>
          <button data-speed="2">2×</button>
          <button data-speed="5">5×</button>
          <button data-speed="10">10×</button>
          <button data-speed="30">30×</button>
        </div>
        <div id="file-buttons">
          <button id="btn-export" class="top-btn" title="마을을 파일로 저장">내보내기</button>
          <button id="btn-import" class="top-btn" title="저장한 파일로 마을 불러오기">불러오기</button>
          <button id="btn-reset" class="top-btn danger" title="Day 0 으로 처음부터">초기화</button>
          <input id="import-file" type="file" accept="application/json,.json" hidden />
        </div>
      </header>

      <main id="layout">
        <section id="frame">
          <div id="game"></div>
          <div id="ui">
            <div id="hud"><canvas id="sky" width="320" height="40"></canvas></div>
            <button id="zoom-reset" class="hidden" aria-label="전체 보기">⤢ 전체 보기</button>
            <div id="card" class="hidden"></div>
            <div id="loading">마을을 불러오는 중…</div>
          </div>
        </section>

        <aside id="side">
          <nav id="tabs">
            <button data-tab="now" class="on">지금 마을</button>
            <button data-tab="rel">관계도</button>
            <button data-tab="news">소식</button>
          </nav>
          <section class="panel tab" id="tab-now"><ul id="now-list"></ul></section>
          <section class="panel tab hidden" id="tab-rel">
            <svg id="rel-graph" viewBox="0 0 320 300"></svg>
            <div id="rel-detail">화살표나 이름을 누르면 서로를 어떻게 생각하는지 보여요.</div>
          </section>
          <section class="panel tab hidden" id="tab-news"><ol id="news-list"></ol></section>
        </aside>
      </main>
    </div>

    <!-- 자리를 비운 사이 -->
    <div id="brief-modal" class="modal hidden">
      <div class="modal-box">
        <h2>자리를 비운 사이</h2>
        <p id="brief-sub"></p>
        <div id="brief-body"></div>
        <div class="row buttons"><span></span><button id="brief-close">확인</button></div>
      </div>
    </div>

    <!-- 초기화 -->
    <div id="reset-modal" class="modal hidden">
      <div class="modal-box">
        <h2>마을 초기화</h2>
        <p>모든 기억·관계·돈·레벨이 지워지고, 지금 시각에서 Day 0 으로 다시 시작해요. 솜과 슈만 연인으로 시작하고 나머지는 모두 모르는 사이예요.</p>
        <label class="row"><input type="checkbox" id="reset-random" /> 특성을 무작위로 새로 뽑기</label>
        <div class="row buttons"><button id="reset-cancel" class="ghost">취소</button><button id="reset-ok" class="danger">초기화</button></div>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
